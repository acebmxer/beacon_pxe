version: 2
updates:
  # Keep the SHA-pinned GitHub Actions (see publish.yml) updated deliberately,
  # so pinning to a commit doesn't mean silently running a stale, vulnerable
  # action forever. Dependabot bumps both the SHA and the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Python deps for the web image are pinned in web/requirements.txt with CVE
  # notes; let Dependabot surface upstream security releases.
  - package-ecosystem: pip
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # passlib 1.7.4 (unmaintained) breaks with bcrypt >=4.1: 4.1–4.x emit a
      # noisy warning, and 5.x crashes the app at startup (hashpw() raises on
      # >72-byte secrets, which passlib's load-time self-test triggers). Keep
      # bcrypt on 4.0.x until passlib is replaced with direct bcrypt usage.
      - dependency-name: bcrypt
        versions: [">=4.1"]
