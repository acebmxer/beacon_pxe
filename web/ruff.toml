# Correctness rules only (pyflakes + the pycodestyle error subset). The code is
# not formatted with ruff, so there is no `ruff format --check` step.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests call helpers for their side effects and keep the handle for readability.
"tests/*" = ["F401", "F841"]
